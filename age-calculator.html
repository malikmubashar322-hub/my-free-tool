<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🗓️ Free Age Calculator Tool</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 100%; }
        h2 { color: #007bff; margin-bottom: 20px; }
        input[type="date"] { width: 100%; padding: 10px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; box-sizing: border-box; }
        button { background-color: #007bff; color: white; border: none; padding: 12px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; width: 100%; font-weight: bold; }
        button:hover { background-color: #0056b3; }
        .result { margin-top: 20px; font-size: 18px; font-weight: bold; color: #28a745; }
        .back-btn { margin-top: 25px; display: inline-block; color: #007bff; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>🗓️ Age Calculator</h2>
    <p>Apni tareekh-e-paisaish (DOB) select karein:</p>
    <input type="date" id="dob">
    <button onclick="calculateAge()">Age Calculate Karein</button>
    <div id="result" class="result"></div>
    <br>
    <a href="index.html" class="back-btn">⬅️ Back to Main Menu</a>
</div>

<script>
function calculateAge() {
    let dobInput = document.getElementById('dob').value;
    if(!dobInput) {
        document.getElementById('result').innerText = "Plz date select karein!";
        return;
    }
    let dob = new Date(dobInput);
    let diff = Date.now() - dob.getTime();
    let ageDate = new Date(diff); 
    let years = Math.abs(ageDate.getUTCFullYear() - 1970);
    
    document.getElementById('result').innerText = "Aap ki umar " + years + " saal hai! 🎉";
}
</script>

</body>
</html>
