<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌍 Global Multi-Currency Converter Tool</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; max-width: 450px; width: 100%; }
        h2 { color: #28a745; margin-bottom: 20px; }
        label { display: block; text-align: left; font-weight: bold; margin-top: 10px; color: #555; }
        input[type="number"], select { width: 100%; padding: 12px; margin-top: 5px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; box-sizing: border-box; }
        .result { margin-top: 20px; font-size: 22px; font-weight: bold; color: #28a745; background: #eafaf1; padding: 15px; border-radius: 6px; }
        .back-btn { margin-top: 25px; display: inline-block; color: #007bff; text-decoration: none; font-weight: bold; }
        .loading { font-size: 14px; color: #777; }
    </style>
</head>
<body>

<div class="container">
    <h2>🌍 Global Currency Converter</h2>
    
    <label for="currencySelect">Currency Select Karein:</label>
    <select id="currencySelect" onchange="convertCurrency()">
        <option value="" class="loading">Currencies load ho rahi hain...</option>
    </select>

    <label for="amountInput">Miqdar (Amount) Likhein:</label>
    <input type="number" id="amountInput" placeholder="Amount darj karein" oninput="convertCurrency()" min="0" value="1">
    
    <div id="currencyResult" class="result">Rs. 0.00 PKR 🇵🇰</div>
    <br>
    <a href="index.html" class="back-btn">⬅️ Back to Main Menu</a>
</div>

<script>
// Puri duniya ki currencies ke rates ka data store karne ke liye variable
let globalRates = {};

// Website khultay hi internet se saari currencies load karne ka function
async function loadCurrencies() {
    try {
        // Free open-source API standard USD rates fetch karne ke liye
        let response = await fetch('https://er-api.com');
        let data = await response.json();
        
        if (data && data.rates) {
            globalRates = data.rates;
            let select = document.getElementById('currencySelect');
            select.innerHTML = ''; // Loading text khatam karne ke liye
            
            // Saari 160+ currency codes ko alphabetically short kar ke dropdown mein daalna
            Object.keys(data.rates).sort().forEach(currencyCode => {
                let option = document.createElement('option');
                option.value = currencyCode;
                option.text = currencyCode;
                if(currencyCode === "USD") option.selected = true; // By default USD select rahega
                select.appendChild(option);
            });
            
            convertCurrency(); // Pehli dafa automatic convert karne ke liye
        }
    } catch (error) {
        document.getElementById('currencyResult').innerText = "Internet connection check karein!";
    }
}

// Convert karne ka function
function convertCurrency() {
    let amount = document.getElementById('amountInput').value;
    let selectedCurrency = document.getElementById('currencySelect').value;
    
    if(!amount || amount < 0 || !globalRates[selectedCurrency] || !globalRates["PKR"]) {
        document.getElementById('currencyResult').innerText = "Rs. 0.00 PKR 🇵🇰";
        return;
    }
    
    // Formula: (Amount / Selected Currency Rate) * PKR Rate (Taza interbank rate ke mutabiq)
    let amountInUSD = amount / globalRates[selectedCurrency];
    let amountInPKR = amountInUSD * globalRates["PKR"];
    
    let formattedPKR = amountInPKR.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
    document.getElementById('currencyResult').innerText = "Rs. " + formattedPKR + " PKR 🇵🇰";
}

// Page load hotay hi currencies fetch shuru ho jaye
loadCurrencies();
</script>

</body>
</html>
