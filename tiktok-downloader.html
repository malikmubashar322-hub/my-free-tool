<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ Free TikTok Video Downloader (No Watermark)</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; max-width: 600px; width: 100%; height: auto; }
        h2 { color: #fe2c55; margin-bottom: 5px; margin-top: 0; }
        p { color: #666; font-size: 15px; margin-bottom: 20px; }
        .downloader-frame { width: 100%; height: 380px; border: none; border-radius: 8px; background: #ffffff; }
        .back-btn { margin-top: 20px; display: inline-block; color: #007bff; text-decoration: none; font-weight: bold; font-size: 16px; }
    </style>
</head>
<body>

<div class="container">
    <h2>🎵 TikTok Video Downloader</h2>
    <p>Fast, stable, and unlimited video downloads without watermark</p>
    
    <!-- Professional Secured High-Speed Downloader Widget Embedding -->
    <iframe class="downloader-frame" src="https://ssstik.io"></iframe>
    
    <br>
    <a href="/" class="back-btn">⬅️ Back to Main Menu</a>
</div>

<script>
// Auto fallback adjustment for better view inside the widget frame
window.addEventListener('DOMContentLoaded', () => {
    let frame = document.querySelector('.downloader-frame');
    if(window.innerWidth < 500) {
        frame.style.height = "420px";
    }
});
</script>

</body>
</html>
